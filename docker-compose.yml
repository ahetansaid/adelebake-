# Base PostgreSQL de développement local — ne pas utiliser en production.
services:
  db:
    image: postgres:17-alpine
    container_name: adelebake-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adelebake
      POSTGRES_USER: adelebake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adelebake_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - adelebake-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adelebake -d adelebake"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  adelebake-pg:
